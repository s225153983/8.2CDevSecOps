# sonar-project.properties
# SIT753 7.1C Part 2 Task 1, SonarCloud analysis of the nodejs-goof application.

sonar.projectKey=s225153983_8.2CDevSecOps
sonar.organization=s225153983
sonar.host.url=https://sonarcloud.io

# The authentication token is not written here. The Jenkins pipeline passes it
# at run time with -Dsonar.token, reading it from the SONAR_TOKEN credential,
# so the secret never reaches the repository.

sonar.projectName=NodeJS Goof Vulnerable App
sonar.projectVersion=1.0

sonar.sources=.
sonar.exclusions=node_modules/**,coverage/**,sonar-scanner-*/**,public/js/bundle.js,**/*.min.js,exploits/**
sonar.tests=tests
sonar.test.inclusions=tests/**/*.spec.js,tests/**/*.test.js

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
